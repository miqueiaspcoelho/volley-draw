{% extends "base.html" %}

{% block content %}
  <section class="mx-auto max-w-sm space-y-4 pt-12">
    <div>
      <h1 class="text-2xl font-semibold">Entrar</h1>
      <p class="text-sm text-slate-600">Informe seu usuario e PIN.</p>
    </div>

    {% if error %}
      <div class="rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">{{ error }}</div>
    {% endif %}

    <form class="space-y-3 rounded border border-slate-200 bg-white p-4 shadow-sm" method="post" action="/login">
      <label class="grid gap-1 text-sm font-medium">
        Usuario
        <input class="h-10 rounded border border-slate-300 px-3 font-normal" name="username" autocomplete="username" required>
      </label>
      <label class="grid gap-1 text-sm font-medium">
        PIN
        <input class="h-10 rounded border border-slate-300 px-3 font-normal" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      </label>
      <button class="h-10 w-full rounded bg-slate-900 px-4 text-sm font-medium text-white" type="submit">Entrar</button>
    </form>
  </section>
{% endblock %}
