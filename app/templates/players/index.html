{% extends "base.html" %}

{% block content %}
  <section class="space-y-4">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <h1 class="text-2xl font-semibold">Jogadores</h1>
        <p class="text-sm text-slate-600">Cadastro e notas para sorteio.</p>
      </div>
    </div>

    {% if error %}
      <div class="rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">{{ error }}</div>
    {% endif %}
    {% if success %}
      <div class="rounded border border-green-200 bg-green-50 px-3 py-2 text-sm text-green-800">{{ success }}</div>
    {% endif %}

    <section class="rounded border border-[#affbff] bg-white p-4 shadow-sm">
      <h2 class="mb-3 text-base font-semibold">Importar CSV</h2>
      <form class="flex flex-col gap-3 sm:flex-row sm:items-end" method="post" action="/jogadores/importar-csv" enctype="multipart/form-data">
        <label class="grid gap-1 text-sm font-medium sm:flex-1">
          Arquivo CSV
          <input class="h-10 rounded border border-[#febf97] px-3 py-2 font-normal focus:outline-none focus:ring-2 focus:ring-[#fe6960]" name="csv_file" type="file" accept=".csv,text/csv" required>
        </label>
        <button class="h-10 rounded bg-[#fe6960] px-4 text-sm font-medium text-white transition hover:bg-[#e85e56]" type="submit">Importar</button>
      </form>
    </section>

    {% include "players/_form.html" %}
    {% include "players/_list.html" %}
  </section>
{% endblock %}
