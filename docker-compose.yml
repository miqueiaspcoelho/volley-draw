services:
  db:
    image: postgres:16
    container_name: volley-draw-db
    environment:
      POSTGRES_DB: volley_draw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # ports:
    #   - "5432:5432"
    volumes:
      - volley-draw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d volley_draw"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: volley-draw-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/volley_draw
      VOLLEY_DRAW_API_BASE_URL: https://apiteams-q4s3.onrender.com
      VOLLEY_DRAW_API_VERIFY_TLS: "true"
      VOLLEY_DRAW_SESSION_SECRET: change-me-before-production
      VOLLEY_DRAW_SESSION_COOKIE_SECURE: "false"
    ports:
      - "8005:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  volley-draw-postgres-data:
